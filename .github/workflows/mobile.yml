name: mobile
on:
  push:
    paths: ['apps/mobile/**', 'packages/contracts/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**']
jobs:
  check:
    # Pinned off `ubuntu-latest` (migrating to Ubuntu 26) for stable tooling.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.3' }
      - run: bun install
      - run: bunx vp fmt ./apps/mobile '!**/CHANGELOG.md' --check
      - run: bun --filter '@kikitai/mobile' check
      # Static SPA build (adapter-static → build/). Native packaging
      # (`npx cap add` + `cap sync` + Xcode/Gradle) runs on release tags, not here.
      - run: bun --filter '@kikitai/mobile' build
