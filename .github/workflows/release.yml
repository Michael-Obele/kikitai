# ONE release page for every native shell. Web deploys via Netlify (not here).
#
# Flow: any feat:/fix: on main → release-please opens ONE PR bumping the root
# version → merge cuts ONE tag `vX.Y.Z` → this workflow builds every native
# artifact and attaches it to that ONE release.
#
# | Trigger              | What happens                                          |
# | -------------------- | ----------------------------------------------------- |
# | push tag `v*`        | draft release → all builds → APKs + bundles attached → published |
# | manual dispatch      | APK jobs build only (no release touched; tauri skipped) |
#
# Secrets needed: none. Debug APKs are SDK-signed; Tauri bundles are unsigned
# (Gatekeeper/SmartScreen will warn — signing identities come later).
name: release
on:
  # `v*` after `include-component-in-tag: false`; the one legacy
  # `kikitai-monorepo-v*` tag from the first unified release also matches.
  push:
    tags: ['v*', 'kikitai-monorepo-v*']
  workflow_dispatch:
jobs:
  create-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      # `gh release` shells out to git for repo context — needs a checkout.
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - if: startsWith(github.ref, 'refs/tags/')
        id: create
        # Resolve the draft release's id via `gh release view` (tag path).
        # NOTE: the raw `GET /releases/tags/{tag}` endpoint 404s for
        # GITHUB_TOKEN on drafts even when `view`/`upload` by tag work fine —
        # never use it here. Accept digits only (`gh` prints API errors to
        # stdout); anything else retries, then creates.
        run: |
          TAG="${{ github.ref_name }}"
          lookup() { gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true; }
          ID="$(lookup)"
          case "$ID" in ''|*[!0-9]*) ID="";; esac
          tries=0
          while [ -z "$ID" ] && [ "$tries" -lt 6 ]; do
            gh release create "$TAG" --draft --title "Kikitai $TAG" --generate-notes >/dev/null 2>&1 || true
            sleep 15
            ID="$(lookup)"
            case "$ID" in ''|*[!0-9]*) ID="";; esac
            tries=$((tries + 1))
          done
          [ -n "$ID" ] || { echo "release $TAG never appeared"; exit 1; }
          echo "release-id=$ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apk-native:
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KIKITAI_ORIGIN: ${{ vars.KIKITAI_ORIGIN }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.3.1' }
      - run: gradle -p apps/android-native assembleDebug --console=plain
      - run: >
          mv apps/android-native/app/build/outputs/apk/debug/app-debug.apk
          kikitai-read-android-native-${{ github.ref_name }}-debug.apk
      - if: startsWith(github.ref, 'refs/tags/')
        run: >
          gh release upload "${{ github.ref_name }}"
          kikitai-read-android-native-${{ github.ref_name }}-debug.apk --clobber

  apk-capacitor:
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.3' }
      - run: bun install
      - uses: actions/setup-java@v6
        # Capacitor 7.6.x compiles with source/target 21 — JDK 17 fails with
        # `invalid source release: 21`. (The native app stays on 17; untouched.)
        with: { distribution: 'temurin', java-version: '21' }
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - run: bun --filter '@kikitai/mobile' build
      - run: bunx cap add android && bunx cap sync
        working-directory: apps/mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
        working-directory: apps/mobile/android
      - run: >
          mv apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          kikitai-read-mobile-${{ github.ref_name }}-debug.apk
      - if: startsWith(github.ref, 'refs/tags/')
        run: >
          gh release upload "${{ github.ref_name }}"
          kikitai-read-mobile-${{ github.ref_name }}-debug.apk --clobber

  tauri:
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 for AppImage glibc compat; others pinned, not -latest.
        include:
          - os: ubuntu-22.04
          - os: windows-2025
          - os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.3' }
      - run: bun install
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          libappindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [create-release, apk-native, apk-capacitor, tauri]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # `gh release` shells out to git for repo context — needs a checkout.
      - uses: actions/checkout@v6
      - run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
