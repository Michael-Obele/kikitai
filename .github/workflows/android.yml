name: android
on:
  push:
    paths: ['apps/android-native/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android-native/**']
jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      # Empty defaults compile; release builds override via Actions
      # variables/secrets (see docs/release.md).
      KIKITAI_ORIGIN: ${{ vars.KIKITAI_ORIGIN }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          # Default `packages` includes the long-removed `tools` package,
          # which fails the step — pin exactly what AGP 8.6 + compileSdk 36 need.
          packages: platform-tools "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle -p apps/android-native assembleDebug --console=plain
