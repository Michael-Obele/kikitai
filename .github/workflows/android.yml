name: android
on:
  push:
    paths: ['apps/android-native/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android-native/**']
jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      # Empty defaults compile; release builds override via Actions
      # variables/secrets (see docs/release.md).
      KIKITAI_ORIGIN: ${{ vars.KIKITAI_ORIGIN }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          # Default `packages` includes the long-removed `tools` package,
          # which fails the step — pin exactly what AGP 9.1 + compileSdk 36 need
          # (no quotes: the action passes each token straight to sdkmanager).
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        # AGP 9.x needs Gradle 9.x (BOM 2026.09.00 artifacts require AGP 9.1+,
        # which needs Gradle 9.3.1+).
        with: { gradle-version: '9.3.1' }
      # TEMP-DEBUG: print resolved material3/compose/kotlin versions.
      - run: gradle -p apps/android-native :app:dependencies --configuration debugCompileClasspath --console=plain | grep -iE 'material3|androidx.compose.(ui|runtime|foundation)|kotlin-stdlib|compose.compiler' | head -n 40
      - run: gradle -p apps/android-native assembleDebug --console=plain
