name: android
on:
  push:
    paths: ['apps/android-native/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android-native/**']
jobs:
  assemble:
    # Pinned off `ubuntu-latest` (migrating to Ubuntu 26) for stable tooling.
    runs-on: ubuntu-24.04
    env:
      # Empty defaults compile; release builds override via Actions
      # variables/secrets (see docs/release.md).
      KIKITAI_ORIGIN: ${{ vars.KIKITAI_ORIGIN }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          # Default `packages` includes the long-removed `tools` package,
          # which fails the step — pin exactly what AGP 9.1 + compileSdk 36 need
          # (no quotes: the action passes each token straight to sdkmanager).
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        # AGP 9.x needs Gradle 9.x (M3 1.4.0-era artifacts need AGP 8.6+,
        # current pin is 9.1, which needs Gradle 9.3.1+).
        with: { gradle-version: '9.3.1' }
      - run: gradle -p apps/android-native assembleDebug --console=plain
