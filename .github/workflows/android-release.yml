# Android release: debug APK attached to the GitHub Release tab.
#
# Flow (see docs/release.md): bump `versionName`/`versionCode` by hand, push tag
# `android-v<versionName>`, this builds + attaches the APK. No secrets needed:
# debug builds use the SDK debug key. A store-signed `release` APK needs
# `ANDROID_KEYSTORE_*` secrets first — deliberately not wired yet.
name: android-release
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KIKITAI_ORIGIN: ${{ vars.KIKITAI_ORIGIN }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.3.1' }
      # The tag must match `versionName` so asset names never lie.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="android-v$(grep -oP 'versionName = "\K[^"]+' apps/android-native/app/build.gradle.kts)"
          test "${{ github.ref_name }}" = "$want" || { echo "tag ${{ github.ref_name }} != $want"; exit 1; }
      - run: gradle -p apps/android-native assembleDebug --console=plain
      - run: >
          mv apps/android-native/app/build/outputs/apk/debug/app-debug.apk
          kikitai-read-${{ github.ref_name }}-debug.apk
      - uses: softprops/action-gh-release@v2
        # Tags only: a manual dispatch proves the build without publishing
        # (otherwise this would cut a junk release named after the branch).
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: kikitai-read-${{ github.ref_name }}-debug.apk
          body: |
            Debug-signed APK (installable as-is). Built from `${{ github.sha }}`.
            A Play-signed release APK needs keystore secrets — see
            `docs/release.md` (Android) for the follow-up.
