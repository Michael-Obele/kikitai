# Commit message → version (release-please, conventional commits).
#
# | Commit message                          | Version bump            | Example                              |
# | --------------------------------------- | ----------------------- | ------------------------------------ |
# | `fix(scope): …`                         | patch  `0.0.1 → 0.0.2`  | `fix(mobile): retry import`          |
# | `feat(scope): …`                        | minor  `0.0.1 → 0.1.0`  | `feat(desktop): file-open for .txt`  |
# | `feat(scope)!: …` / `BREAKING CHANGE:`  | major  `0.0.1 → 1.0.0`  | `feat(contracts)!: rename spokenText`|
# | `chore|docs|ci|test|refactor|style: …`  | no release              | `docs: webgpu matrix`                |
#
# The scope selects the changelog section, NOT the package: release-please
# releases whichever packages have touched paths in the commits.
# Unscoped feat:/fix: touching one package releases just that package.
# Full rules: docs/release.md. Android is versioned by hand (see that doc).
name: release
on:
  push:
    branches: ['main']
jobs:
  release:
    # Pinned off `ubuntu-latest` (migrating to Ubuntu 26) for stable tooling.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
