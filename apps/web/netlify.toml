# Netlify build settings — read only by Netlify (local and Docker builds keep
# using `bun run build`, which picks adapter-node; see the `target` note in
# vite.config.ts).
#
# Monorepo note (Netlify recommended setup): Base directory = repo root (/),
# Package directory = apps/web. The build command runs in BASE, so it must
# target the workspace (`bun --filter @kikitai/web build`).
#
# There is deliberately NO `publish` key here. One value cannot satisfy both
# readers of this file:
# - Netlify resolves `publish` relative to BASE (repo root).
# - adapter-netlify reads this same file relative to its cwd (apps/web/,
#   where `bun --filter` runs the build) and defaults to `build` when the
#   key is absent — which lands exactly at apps/web/build.
# So: keep `publish` out of this file and set Publish directory = apps/web/build
# in the Netlify UI (Site configuration > Build & deploy > Continuous
# deployment > Build settings). Verified against adapter-netlify 6.0.4
# (`get_publish_directory` falls back to 'build') and
# https://svelte.dev/docs/kit/adapter-netlify (publish defaults to `build`).
[build]
# `bun.lock` (text) is not one of Netlify's auto-detected lockfiles
# (it looks for bun.lockb / yarn.lock / pnpm-lock.yaml), so install explicitly.
command = "bun install && bun --filter @kikitai/web build"

[build.environment]
# Skip Netlify's default `npm install` — Bun owns this lockfile, and npm's
# strict peer resolution can fail where `bun install` succeeds.
NPM_FLAGS = "--version"
# Same Bun line as packageManager (`bun@1.4.3`) and Dockerfile (`oven/bun:1.4-alpine`).
BUN_VERSION = "1.4.3"
# Netlify's default is already 24 — pinned so a build-image bump can't move it.
NODE_VERSION = "24"
